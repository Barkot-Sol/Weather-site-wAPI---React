<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Forcast</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
    <link rel="icon" type="image/png" href="Images/Icon.png">
</head>
<body>
    <main class="overall-container">
        <section class="title-container">
            <div class="date-div"></div>
            <div class="title-div">
                <h1 class="title">Weather Forcast</h1>
            </div>
            <section class="weather-output">
                <article class="output">
                    <h1 id="city-name"></h1>
                    <h2 id="temp"></h2>
                    <p id="temp-range"></p>
                    <p id="humidity-wind"></p>
                    <p id="description"></p>
                    <!-- <p id="wind"></p> -->
                </article>
            </section>
            <form id="searching">
                <input type="text" id="search" placeholder="Enter a city">
                <input type="submit" class="submit">
            </form>
        </section>
        <section class="example-container">
            <h2 class="example-title">Popular Cities</h2>
            <hr>
        </section>
    </main>
</body>
<script src="index.js"></script>
</html>
